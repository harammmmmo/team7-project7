
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학점 계산기</title>
</head>
<body>
    <h1>학점 계산기</h1>
    <p>4.5 만점 학점 계산기</p>

    <input type="text" id="name" placeholder="과목명">
    <input type="number" id="credits" placeholder="학점" min="1">

    <select id="grade">
        <option>A+</option>
        <option>A0</option>
        <option>B+</option>
        <option>B0</option>
        <option>C+</option>
        <option>C0</option>
        <option>D+</option>
        <option>D0</option>
        <option>F</option>
    </select>

    <button onclick="addCourse()">과목 추가</button>
    <ul id="courseList"></ul>

    <script src="app.js"></script>
</body>
</html>
